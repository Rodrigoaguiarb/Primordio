    </radialGradient>
    <filter id="s2"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.7"/></filter>
  </defs>
  <g filter="url(#s2)">
    <!-- corrente horizontal que sai do centro pros lados -->
    <g stroke="url(#o2)" stroke-width="3.5" fill="none" stroke-linecap="round">
      <path d="M260 28 C230 14, 200 42, 170 28 C140 14, 110 42, 80 28 C55 17, 30 38, 8 28"/>
      <path d="M260 28 C290 14, 320 42, 350 28 C380 14, 410 42, 440 28 C465 17, 490 38, 512 28"/>
