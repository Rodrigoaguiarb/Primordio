<svg xmlns="http://www.w3.org/2000/svg" width="520" height="56" viewBox="0 0 520 56">
  <defs>
    <linearGradient id="o2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8eeb8"/>
      <stop offset="0.45" stop-color="#d4af4e"/>
      <stop offset="0.75" stop-color="#8a6f24"/>
      <stop offset="1" stop-color="#3a2c0e"/>
    </linearGradient>
    <radialGradient id="medal" cx="0.5" cy="0.4" r="0.7">
