    <!-- elos -->
    <g fill="url(#o2)">
      <circle cx="170" cy="28" r="4.5"/><circle cx="80" cy="28" r="4.5"/>
      <circle cx="350" cy="28" r="4.5"/><circle cx="440" cy="28" r="4.5"/>
    </g>
    <!-- volutas/serpentes nas pontas -->
    <g stroke="url(#o2)" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M8 28 C2 20, 14 14, 18 22 C20 27, 13 30, 12 25"/>
      <path d="M512 28 C518 20, 506 14, 502 22 C500 27, 507 30, 508 25"/>
