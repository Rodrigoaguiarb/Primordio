    <circle cx="260" cy="28" r="13" fill="none" stroke="url(#o2)" stroke-width="1.4" opacity="0.8"/>
    <!-- losango/estrela primordial dentro -->
    <path d="M260 17 L267 28 L260 39 L253 28 Z" fill="url(#o2)" opacity="0.95"/>
    <circle cx="260" cy="28" r="3" fill="#1a3a1a"/>
